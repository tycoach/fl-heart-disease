[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-heart-disease"
version = "0.1.0"
description = "Federated learning for multi-institutional cardiovascular disease prediction"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "flwr[simulation]>=1.8",
    "scikit-learn",
    "pandas",
    "numpy",
    "pyyaml",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
