seed_list: [0, 1, 2, 3, 4]

data:
  raw_dir: data/raw
  processed_dir: data/processed
  sites: [cleveland, hungarian, switzerland, va]
  target_binarize: true        # num > 0 -> 1
  test_size: 0.2
  val_size: 0.15               # taken from the training portion

model:
  hidden_sizes: [64, 32]       # tune later; Figure 3.1 uses generic labels
  dropout: 0.3

training:
  lr: 0.001
  batch_size: 32
  epochs: 100                  # siloed / centralized
  early_stopping_patience: 10

federated:
  num_rounds: 30
  local_epochs: 5
  fraction_fit: 1.0            # all 4 institutions participate each round
  aggregation: fedavg          # weighted by local dataset size

output:
  metrics_dir: results/metrics
  figures_dir: results/figures
  logs_dir: results/logs
